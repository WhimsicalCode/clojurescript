[package]
name = "cljf-prune"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native pruning of ClojureScript ES module bundles for clojurific's Vite plugin (prune.js)"
license = "EPL-1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "=3.15.0", default-features = false, features = ["napi4"] }
napi-derive = "=3.6.13"
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_span = "=0.155.0"
rayon = "=1.12.0"
rustc-hash = "=2.1.3"

[dev-dependencies]
serde_json = "=1.0.154"

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
lto = true
codegen-units = 1
